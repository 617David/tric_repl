<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="128" cy="128" r="120" fill="url(#grad)"/>

  <!-- Euro symbol -->
  <text x="128" y="180" font-family="Arial, sans-serif" font-size="140" font-weight="bold"
        text-anchor="middle" fill="white">€</text>

  <!-- Split lines -->
  <line x1="80" y1="100" x2="160" y2="140" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="100" x2="80" y2="140" stroke="white" stroke-width="6" stroke-linecap="round"/>
</svg>
